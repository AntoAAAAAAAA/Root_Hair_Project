
name: desktop-app
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      # Scientific computing
      - numpy
      - scipy
      - pandas
      - matplotlib
      - scikit-image
      - opencv-python
      - pillow
      - networkx
      - sknw
      - diplib

      # Machine learning
      - torch
      - torchvision
      - nnunetv2
      - ultralytics
      - SimpleITK

      # Visualization and UI
      - streamlit
      - plotly
      - streamlit-desktop-app
      - pywebview

      # Utilities
      - platformdirs
      - psutil
      - openpyxl
      - pyyaml
